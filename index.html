    * { box-sizing: border-box; }

    body {
        font-family: 'Noto Sans Telugu', sans-serif;
        background: #fdf8ec;
        color: #2b2b2b;
        margin: 0;
        padding: 0 0 60px 0;
        line-height: 1.5;
    }

    .header {
        text-align: center;
        background: linear-gradient(135deg, #b8860b, #d4a017);
        color: #fff;
        padding: 28px 16px 20px;
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header .emoji { font-size: 30px; }

    .ganesh-photo {
        width: 140px;
        height: 176px;
        border-radius: 14px;
        object-fit: cover;
        object-position: top center;
        border: 4px solid #fff;
        box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        margin-bottom: 10px;
    }

    .header h1 {
        font-size: 20px;
        margin: 6px 0 2px 0;
    }

    .header .sub {
        font-size: 12.5px;
        opacity: 0.9;
        margin: 0 0 12px 0;
    }

    .progress-wrap {
        max-width: 480px;
        margin: 0 auto;
    }

    .progress-bar-bg {
        background: rgba(255,255,255,0.35);
        border-radius: 20px;
        height: 10px;
        overflow: hidden;
    }

    .progress-bar-fill {
        background: #fff;
        height: 100%;
        border-radius: 20px;
        transition: width 0.25s ease;
        width: 0%;
    }

    .progress-text {
        font-size: 12px;
        margin-top: 6px;
        font-weight: 600;
    }

    .container {
        max-width: 620px;
        margin: 0 auto;
        padding: 16px;
    }

    .section {
        margin-top: 16px;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .section-title {
        background: #b8860b;
        color: #fff;
        font-size: 14.5px;
        font-weight: 700;
        padding: 10px 14px;
    }

    .note {
        font-size: 11.5px;
        color: #8a7550;
        font-style: italic;
        padding: 8px 14px 2px;
        background: #fdf3d9;
    }

    ul.items {
        list-style: none;
        margin: 0;
        padding: 4px 0;
    }

    ul.items li {
        display: flex;
        align-items: flex-start;
        padding: 9px 14px;
        border-bottom: 1px solid #f1e8cf;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s ease;
    }

    ul.items li:last-child { border-bottom: none; }

    ul.items li:active { background: #fdf3d9; }

    ul.items li.checked .label {
        color: #aaa;
        text-decoration: line-through;
    }

    .checkbox {
        width: 20px;
        height: 20px;
        min-width: 20px;
        border: 2px solid #b8860b;
        border-radius: 4px;
        margin-right: 12px;
        margin-top: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease, border-color 0.15s ease;
        flex-shrink: 0;
    }

    ul.items li.checked .checkbox {
        background: #b8860b;
    }
    .checkbox svg {
        width: 13px;
        height: 13px;
        opacity: 0;
        transition: opacity 0.1s ease;
    }

    ul.items li.checked .checkbox svg {
        opacity: 1;
    }

    .label {
        font-size: 14px;
        flex: 1;
    }

    .idx-num {
        color: #b8860b;
        font-weight: 700;
        margin-right: 6px;
        font-size: 13px;
    }

    .latin {
        color: #999;
        font-style: italic;
    }

    .toolbar {
        max-width: 620px;
        margin: 18px auto 0;
        padding: 0 16px;
        display: flex;
        gap: 10px;
    }

    button.reset-btn {
        flex: 1;
        background: #fff;
        border: 1.5px solid #b8860b;
        color: #8b4513;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
    }

    button.reset-btn:active {
        background: #fdf3d9;
    }

    .install-box {
        max-width: 620px;
        margin: 14px auto 0;
        padding: 0 16px;
    }

    button.install-btn {
        width: 100%;
        background: #8b4513;
        border: none;
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        display: none;
    }

    button.install-btn:active {
        background: #6e3610;
    }

    .install-hint {
        font-size: 12px;
        color: #8a7550;
        text-align: center;
        margin: 8px 4px 0;
        line-height: 1.5;
    }

    .footer-note {
        text-align: center;
        font-size: 11px;
        color: #aaa;
        margin-top: 22px;
        padding: 0 20px;
    }

/* ===== Upgraded festive UI ===== */
:root{
  --gold:#b8860b;
  --deep:#7b1e12;
  --cream:#fffaf0;
  --card:#ffffff;
  --ink:#3c2415;
  --muted:#7d6b5d;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 10% 5%,rgba(255,193,7,.14),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(183,28,28,.10),transparent 25%),
    linear-gradient(180deg,#fffaf0 0%,#fff 42%,#fff8ee 100%);
  color:var(--ink);
}
.hero{
  position:relative;
  overflow:hidden;
  border-radius:0 0 28px 28px;
  box-shadow:0 8px 30px rgba(90,50,20,.13);
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.22),transparent 55%);
  transform:translateX(-100%);
  animation:shine 6s ease-in-out infinite;
}
@keyframes shine{50%{transform:translateX(100%)}100%{transform:translateX(100%)}}
h1{letter-spacing:.2px}
.sub{opacity:.9}
.progress-wrap{
  max-width:720px;
  margin:18px auto 0;
  padding:14px 16px;
  border-radius:18px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(8px);
  box-shadow:0 5px 18px rgba(80,45,15,.08);
}
.progress-bar-bg{height:13px;border-radius:999px;overflow:hidden;background:#eadfce}
.progress-bar-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#b8860b,#e6a91a,#b71c1c);
  transition:width .45s ease;
  position:relative;
}
.progress-bar-fill:after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:progressShine 2.5s linear infinite;
}
@keyframes progressShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.progress-text{font-weight:800;margin-top:8px}
.progress-extra{font-size:.84rem;color:var(--muted);margin-top:3px}
.quick-actions{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:720px;margin:12px auto 0;
}
.filter-btn{
  border:1px solid #dfc89e;background:#fff;border-radius:999px;
  padding:8px 13px;cursor:pointer;font-weight:700;color:#684a2e;
  transition:.2s transform,.2s box-shadow,.2s background;
}
.filter-btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(80,45,15,.10)}
.filter-btn.active{background:#7b1e12;color:#fff;border-color:#7b1e12}
.search-wrap{
  max-width:720px;margin:12px auto 18px;display:flex;align-items:center;gap:8px;
  padding:10px 13px;border:1px solid #ead8bc;border-radius:16px;background:#fff;
  box-shadow:0 5px 16px rgba(80,45,15,.07);
}
.search-wrap input{flex:1;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);min-width:0}
.search-wrap span{font-size:18px}
#clearSearch{display:none;border:0;background:#f2e8da;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:20px;line-height:1}
#clearSearch.show{display:block}
.container{max-width:820px}
.section{
  transition:opacity .25s,transform .25s;
  animation:cardIn .45s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-hidden{display:none}
.filtered-out{display:none!important}
.section-title{
  cursor:pointer;
  user-select:none;
  position:relative;
  padding-right:42px!important;
}
.section-title:after{
  content:"⌃";
  position:absolute;right:16px;top:50%;
  transform:translateY(-50%);
  opacity:.65;
  transition:.2s transform;
}
.section.collapsed .section-title:after{transform:translateY(-50%) rotate(180deg)}
.section.collapsed .items,.section.collapsed .note{display:none}
.section ul.items li,.custom-item{
  transition:transform .18s,box-shadow .18s,background .18s,opacity .18s;
}
.section ul.items li:hover,.custom-item:hover{
  transform:translateX(3px);
  box-shadow:0 5px 14px rgba(80,45,15,.08);
}
.section ul.items li.checked{
  background:linear-gradient(90deg,#eef8e9,#fff);
}
.section ul.items li.checked .label{
  text-decoration:line-through;
  opacity:.62;
}
.checkbox{
  transition:transform .2s,background .2s;
}
.section ul.items li.checked .checkbox,.custom-item.checked .checkbox{
  transform:scale(1.05);
}
.custom-box{
  max-width:820px;margin:18px auto;
  padding:18px;border-radius:20px;background:#fff;
  border:1px solid #ead8bc;box-shadow:0 7px 20px rgba(80,45,15,.07);
}
.custom-title{font-weight:800;margin-bottom:10px}
.custom-row{display:flex;gap:8px}
.custom-row input{
  flex:1;min-width:0;padding:12px 13px;border:1px solid #dcc9aa;border-radius:12px;outline:none;font-size:15px;
}
.custom-row input:focus{border-color:#b8860b;box-shadow:0 0 0 3px rgba(184,134,11,.12)}
.custom-row button{
  border:0;border-radius:12px;padding:0 18px;background:#7b1e12;color:#fff;font-weight:800;cursor:pointer;
}
#customList{margin-top:10px}
.custom-item{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;cursor:pointer}
.custom-item .label{flex:1}
.custom-item.checked .label{text-decoration:line-through;opacity:.6}
.delete-custom{border:0;background:#f7e9e5;color:#8b2a1c;width:30px;height:30px;border-radius:50%;font-size:20px;cursor:pointer}
.toolbar{display:flex;justify-content:center;gap:10px;margin:20px auto}
.reset-btn{transition:.2s transform,.2s box-shadow}
.reset-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(120,30,20,.14)}
.install-box{max-width:820px;margin:14px auto 30px}
.install-btn{width:100%;border-radius:16px!important;padding:13px!important;font-weight:800;box-shadow:0 7px 18px rgba(123,30,18,.15)}
@media(max-width:600px){
  .hero{border-radius:0 0 22px 22px}
  h1{font-size:1.55rem}
  .container{padding-left:12px;padding-right:12px}
  .section{border-radius:18px}
  .section-title{font-size:1rem}
  .filter-btn{padding:7px 10px;font-size:13px}
  .custom-row button{padding:0 14px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

const STORAGE_KEY = "vinayakaChavithiChecklist2026";
const CUSTOM_KEY = "vinayakaChavithiCustomItems2026";
let state = {};
let customItems = [];
let currentFilter = "all";
let searchTerm = "";

try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { state = {}; }
try { customItems = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]"); } catch (e) { customItems = []; }
if (!Array.isArray(customItems)) customItems = [];

const container = document.getElementById("container");
const checkSvg = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12L9 17L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let totalItems = 0;

function makeItem(item, id, section) {
    totalItems++;
    const li = document.createElement("li");
    li.dataset.id = id;
    li.dataset.text = Array.isArray(item) ? item.join(" ") : item;
    if (state[id]) li.classList.add("checked");

    const cb = document.createElement("div");
    cb.className = "checkbox";
    cb.innerHTML = checkSvg;

    const label = document.createElement("div");
    label.className = "label";

    if (section.numbered && Array.isArray(item)) {
        const idxSpan = document.createElement("span");
        idxSpan.className = "idx-num";
        idxSpan.textContent = (section.items.indexOf(item) + 1) + ".";
        label.appendChild(idxSpan);
        label.appendChild(document.createTextNode(item[0] + " — "));
        const latinSpan = document.createElement("span");
        latinSpan.className = "latin";
        latinSpan.textContent = item[1];
        label.appendChild(latinSpan);
    } else {
        label.textContent = Array.isArray(item) ? item.join(" — ") : item;
    }

    li.appendChild(cb);
    li.appendChild(label);
    li.addEventListener("click", () => toggle(id, li));
    return li;
}

DATA.forEach((section, sIdx) => {
    const secEl = document.createElement("div");
    secEl.className = "section";
    secEl.dataset.sectionIndex = sIdx;

    const titleEl = document.createElement("div");
    titleEl.className = "section-title";
    titleEl.textContent = section.title;
    titleEl.addEventListener("click", () => secEl.classList.toggle("collapsed"));
    secEl.appendChild(titleEl);

    const ul = document.createElement("ul");
    ul.className = "items";

    section.items.forEach((item, iIdx) => {
        const id = `s${sIdx}_i${iIdx}`;
        const li = makeItem(item, id, section);
        ul.appendChild(li);
    });

    secEl.appendChild(ul);

    if (section.note) {
        const noteEl = document.createElement("div");
        noteEl.className = "note";
        noteEl.textContent = section.note;
        secEl.appendChild(noteEl);
    }

    container.appendChild(secEl);
});

function toggle(id, li) {
    state[id] = !state[id];
    li.classList.toggle("checked", state[id]);
    save();
    updateProgress();
    applyFilters();
}

function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function updateProgress() {
    const checkedCount = Object.values(state).filter(Boolean).length;
    const pct = totalItems ? Math.round((checkedCount / totalItems) * 100) : 0;
    const remaining = Math.max(0, totalItems - checkedCount);

    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = `${checkedCount} / ${totalItems} completed`;
    document.getElementById("progressExtra").textContent = `${pct}% complete • ${remaining} remaining`;
}

function applyFilters() {
    const term = searchTerm.trim().toLowerCase();
    document.querySelectorAll("#container .section").forEach(section => {
        let visible = 0;
        section.querySelectorAll("ul.items li").forEach(li => {
            const text = (li.dataset.text || li.textContent).toLowerCase();
            const matchesSearch = !term || text.includes(term);
            const done = li.classList.contains("checked");
            const matchesFilter =
                currentFilter === "all" ||
                (currentFilter === "remaining" && !done) ||
                (currentFilter === "done" && done);

            const show = matchesSearch && matchesFilter;
            li.classList.toggle("filtered-out", !show);
            if (show) visible++;
        });
        section.classList.toggle("section-hidden", visible === 0);
    });
    renderCustomItems();
}

document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        applyFilters();
    });
});

const searchInput = document.getElementById("searchInput");
const clearSearch = document.getElementById("clearSearch");

searchInput.addEventListener("input", () => {
    searchTerm = searchInput.value;
    clearSearch.classList.toggle("show", !!searchTerm);
    applyFilters();
});

clearSearch.addEventListener("click", () => {
    searchInput.value = "";
    searchTerm = "";
    clearSearch.classList.remove("show");
    searchInput.focus();
    applyFilters();
});

function saveCustomItems() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customItems)); } catch (e) {}
}

function renderCustomItems() {
    const box = document.getElementById("customList");
    box.innerHTML = "";

    const term = searchTerm.trim().toLowerCase();
    customItems.forEach((item, index) => {
        const id = `custom_${index}`;
        const done = !!state[id];
        const matchesSearch = !term || item.text.toLowerCase().includes(term);
        const matchesFilter =
            currentFilter === "all" ||
            (currentFilter === "remaining" && !done) ||
            (currentFilter === "done" && done);

        if (!matchesSearch || !matchesFilter) return;

        const row = document.createElement("div");
        row.className = "custom-item" + (done ? " checked" : "");

        const cb = document.createElement("div");
        cb.className = "checkbox";
        cb.innerHTML = checkSvg;

        const text = document.createElement("div");
        text.className = "label";
        text.textContent = item.text;

        const del = document.createElement("button");
        del.className = "delete-custom";
        del.type = "button";
        del.textContent = "×";
        del.title = "Delete item";
        del.addEventListener("click", e => {
            e.stopPropagation();
            delete state[id];
            customItems.splice(index, 1);
            saveCustomItems();
            save();
            updateProgress();
            renderCustomItems();
        });

        row.append(cb, text, del);
        row.addEventListener("click", () => {
            state[id] = !state[id];
            save();
            renderCustomItems();
            updateProgress();
        });
        box.appendChild(row);
    });
}

document.getElementById("addCustomBtn").addEventListener("click", addCustomItem);
document.getElementById("customInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addCustomItem();
});

function addCustomItem() {
    const input = document.getElementById("customInput");
    const text = input.value.trim();
    if (!text) return;
    customItems.push({ text });
    saveCustomItems();
    input.value = "";
    renderCustomItems();
}

document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("అన్ని చెక్‌బాక్స్‌లను క్లియర్ చేయాలా? (Clear all checkboxes?)")) {
        state = {};
        save();
        document.querySelectorAll("ul.items li, .custom-item").forEach(el => el.classList.remove("checked"));
        updateProgress();
        applyFilters();
    }
});

// Include custom items in the total count.
totalItems += customItems.length;

updateProgress();
applyFilters();

// --- PWA install handling ---
const installBtn = document.getElementById("installBtn");
let deferredInstallPrompt = null;
const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

if (isStandalone) installBtn.style.display = "none";

window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
    if (!deferredInstallPrompt) {
        alert("Install option will appear when this website is opened from a supported HTTPS web host.");
        return;
    }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = "none";
});

window.addEventListener("appinstalled", () => {
    installBtn.style.display = "none";
});

// Register service worker when hosted over HTTPS/localhost.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
}
</script>
